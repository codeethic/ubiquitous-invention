<style>
:root{
  --deep:#0B1012; --slate:#131A1C; --rise:#1B2427; --rise2:#222D31;
  --line:#2C3A3E; --line-soft:#212C2F;
  --chalk:#F2F0EA; --mute:#8FA0A4; --mute2:#65787D;
  --amber:#FFB020;
  --up:#00B050; --warn:#FFC000; --down:#C00000;
  --display:'Oswald',Impact,'Arial Narrow',sans-serif;
  --body:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--deep); color:var(--chalk); font-family:var(--body);
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none;font-size:inherit}
input,select{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
a{color:inherit;text-decoration:none}

.eyebrow{
  font-family:var(--mono);font-size:10px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--mute2)
}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.num{font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums}

/* ---------- top rail ---------- */
.rail{
  display:flex;align-items:center;gap:22px;
  padding:10px 18px;background:var(--slate);
  border-bottom:1px solid var(--line);
  position:sticky;top:0;z-index:40;flex-wrap:wrap;
}
.wordmark{
  font-family:var(--display);font-weight:700;font-size:20px;
  letter-spacing:.06em;line-height:1
}
.brand .eyebrow{margin-top:2px}
.crumbs{display:flex;align-items:center;gap:6px;flex:1;flex-wrap:wrap;min-width:200px}
.crumb{
  font-family:var(--mono);font-size:11.5px;color:var(--mute);
  padding:3px 7px;border-radius:3px
}
.crumb:hover{background:var(--rise);color:var(--chalk)}
.crumb.here{color:var(--chalk);background:var(--rise2)}
.crumb-sep{color:var(--mute2);font-size:11px}
.railright{display:flex;align-items:center;gap:10px}

.datewrap{
  display:flex;align-items:center;gap:8px;background:var(--rise);
  border:1px solid var(--line);border-radius:4px;padding:4px 8px
}
.datewrap input{
  background:none;border:0;color:var(--chalk);font-family:var(--mono);font-size:12px
}
.datewrap input::-webkit-calendar-picker-indicator{filter:invert(.7)}
.btn{
  border:1px solid var(--line);background:var(--rise);border-radius:4px;
  padding:5px 11px;font-size:12px;color:var(--mute)
}
.btn:hover{background:var(--rise2);color:var(--chalk);border-color:var(--mute2)}
.btn.primary{border-color:var(--amber);color:var(--amber)}
.btn.primary:hover{background:var(--amber);color:var(--deep)}
.btn.warn:hover{background:var(--down);color:var(--chalk);border-color:var(--down)}

/* ---------- layout ---------- */
main{padding:20px 18px 60px;max-width:1500px;margin:0 auto}
.viewhead{display:flex;align-items:baseline;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.viewtitle{font-family:var(--display);font-weight:500;font-size:26px;letter-spacing:.02em}
.panel{
  background:var(--slate);border:1px solid var(--line);
  border-radius:5px;padding:14px 16px
}
.panel h3{
  margin:0 0 10px;font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--mute2);font-weight:500
}
.grid{display:grid;gap:14px}
.note{color:var(--mute2);font-size:12px;font-style:italic}

/* ---------- status ---------- */
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.s-green{background:var(--up)} .s-amber{background:var(--warn)} .s-red{background:var(--down)}
.bar-green{border-left:3px solid var(--up)}
.bar-amber{border-left:3px solid var(--warn)}
.bar-red{border-left:3px solid var(--down)}

/* ---------- facility ---------- */
.bays{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start}
.bay{
  background:var(--slate);border:1px solid var(--line);border-radius:5px;
  padding:12px 13px 14px;flex:1 1 300px
}
.bay-name{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--mute2);margin-bottom:10px
}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:9px}
.tile{
  background:var(--rise);border:1px solid var(--line);border-radius:4px;
  padding:10px 11px;text-align:left;display:block;position:relative;overflow:hidden
}
.tile:hover{background:var(--rise2);border-color:var(--mute2)}
.tile-accent{position:absolute;left:0;top:0;bottom:0;width:3px}
.tile-name{font-family:var(--display);font-weight:500;font-size:17px;letter-spacing:.02em}
.tile-state{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;
  text-transform:uppercase;margin-top:3px
}
.tile-sub{font-size:11px;color:var(--mute2);margin-top:5px}
.tile-badge{
  position:absolute;top:8px;right:8px;font-family:var(--mono);font-size:10px;
  background:var(--warn);color:#241a00;border-radius:9px;padding:1px 6px;font-weight:600
}
.t-green .tile-state{color:var(--up)}
.t-amber .tile-state{color:var(--warn)}
.t-red .tile-state{color:var(--down)}
.t-green .tile-accent{background:var(--up)}
.t-amber .tile-accent{background:var(--warn)}
.t-red .tile-accent{background:var(--down)}

.legend{display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin-top:14px}
.legend span{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--mute)}

/* ---------- tool view ---------- */
/* Column arrangement follows the slide-18 mockup: whiteboard on the left,
   a column of buttons, the reactor, then a second column of buttons. */
.toolwrap{
  display:grid;grid-template-columns:minmax(230px,300px) 158px minmax(220px,1fr) 158px;
  gap:14px;align-items:start
}
@media (max-width:1080px){
  .toolwrap{grid-template-columns:1fr 1fr}
  .stage{grid-column:1 / -1;order:9}
}

.whiteboard{
  background:var(--slate);border:1px solid var(--line);border-radius:5px;padding:13px 14px
}
.wb-row{display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-bottom:1px dotted var(--line-soft)}
.wb-row:last-child{border-bottom:0}
.wb-k{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute2)}
.wb-v{font-family:var(--mono);font-size:12px;text-align:right}
.wb-issues{margin-top:10px}
.wb-issue{
  display:block;font-size:11.5px;color:var(--warn);padding:4px 6px;
  background:rgba(255,192,0,.07);border-radius:3px;margin-top:4px;line-height:1.35
}
.wb-issue:hover{background:rgba(255,192,0,.16)}
.wb-comment{margin-top:10px;font-size:11.5px;color:var(--mute);font-style:italic;line-height:1.45}

.btncol{display:flex;flex-direction:column;gap:6px}
.node{
  display:block;text-align:left;background:var(--rise);border:1px solid var(--line);
  border-left-width:3px;border-radius:4px;padding:7px 9px;position:relative
}
.node:hover{background:var(--rise2);border-color:var(--mute2)}
.node-name{font-size:12.5px;line-height:1.25}
.node-meta{font-family:var(--mono);font-size:9.5px;color:var(--mute2);margin-top:2px}
.node.n-green{border-left-color:var(--up)}
.node.n-amber{border-left-color:var(--warn);background:rgba(255,192,0,.06)}
.node.n-red{border-left-color:var(--down);background:rgba(192,0,0,.08)}
.node.is-sub .node-name::after{content:' ›';color:var(--mute2)}

/* the two-column picker from slides 20 and 21 */

}

<script id="engine">
globalThis.EpiTrax = (() => {
  'use strict';

  // Events sorted and clipped to a point in time. Every derived view starts
  // here: nothing is stored, everything is replayed.
  const upto = (events, iso) =>
    events
      .filter(e => e.at <= iso)
      .sort((a, b) => (a.at < b.at ? -1 : a.at > b.at ? 1 : 0));

  // Which serialized item occupied this slot at a given moment.
  function itemAt(events, componentId, iso) {
    let current = null;
    for (const e of upto(events, iso)) {
      if (e.targetId !== componentId) continue;
      if (e.kind === 'item.installed') current = e.payload.itemId;
      if (e.kind === 'item.removed') current = null;
    }
    return current;
  }

  function stateAt(events, iso) {
    const installed = {};
    const issues = new Map();
    const wos = new Map();
    const toolStates = {};

    for (const e of upto(events, iso)) {
      switch (e.kind) {
        case 'item.installed':
          installed[e.targetId] = e.payload.itemId;
          break;
        case 'item.removed':
          installed[e.targetId] = null;
          break;
        case 'issue.opened':
          // An issue binds to whatever item was in the slot at the time. It
          // keeps that binding even after the item is swapped out.
          issues.set(e.id, {
            id: e.id, targetId: e.targetId, text: e.payload.text,
            at: e.at, by: e.by, itemId: installed[e.targetId] ?? null,
          });
          break;
        case 'issue.closed':
          issues.delete(e.payload.issueId);
          break;
        case 'wo.opened':
          wos.set(e.id, {
            id: e.id, targetId: e.targetId, text: e.payload.text,
            at: e.at, by: e.by, issueIds: e.payload.issueIds ?? [],
          });
          break;
        case 'wo.closed':
          wos.delete(e.payload.woId);
          break;
        case 'state.changed':
          toolStates[e.targetId] = e.payload.state;
          break;
      }
    }

    for (const k of Object.keys(installed)) {
      if (installed[k] === null) delete installed[k];
    }

    return {
      installed,
      openIssues: [...issues.values()],
      openWOs: [...wos.values()],
      toolStates,
    };
  }

  // --- hierarchy and health ---------------------------------------------

  function descendantsOf(entities, entityId) {
    const out = [entityId];
    for (const e of Object.values(entities)) {
      if (e.parentId === entityId) out.push(...descendantsOf(entities, e.id));
    }
    return out;
  }

  // The deck collapses four tool states onto red. Colour alone would lose the
  // distinction, so callers render the state as text alongside the colour.
  const RED_STATES = new Set(['down', 'decommissioned', 'qual', 'pm']);

  function healthOf(entities, events, entityId, iso) {
    const st = stateAt(events, iso);
    const scope = new Set(descendantsOf(entities, entityId));
    for (const id of scope) {
      if (RED_STATES.has(st.toolStates[id])) return 'red';
    }
    const open = [...st.openIssues, ...st.openWOs];
    return open.some(o => scope.has(o.targetId)) ? 'amber' : 'green';
  }

  // --- history ------------------------------------------------------------

  // Row kinds drive the log's row tint, matching the colours in the tool-log
  // screenshot from the deck: runs plain, maintenance blue, issues purple,
  // state changes red.
  const KIND_MAP = {
    'run.recorded': 'run',
    'wo.opened': 'maint', 'wo.closed': 'maint', 'wo.commented': 'maint',
    'issue.opened': 'issue', 'issue.closed': 'issue', 'issue.commented': 'issue',
    'state.changed': 'state', 'comment.added': 'comment',
    'item.installed': 'maint', 'item.removed': 'maint',
    'item.shipped': 'maint', 'item.received': 'maint',
  };

  const DEFAULT_INFO = {
    'wo.opened': 'Maint WO', 'wo.closed': 'Maint WO', 'wo.commented': 'Maint WO',
    'issue.opened': 'Issue', 'issue.closed': 'Issue', 'issue.commented': 'Issue',
    'state.changed': 'State', 'comment.added': 'Comment',
    'item.installed': 'Installed', 'item.removed': 'Removed',
    'item.shipped': 'Shipped', 'item.received': 'Received',
  };

  const LOCATION_NAME = {
    'loc.storage': 'storage', 'loc.repair': 'repair',
    'loc.onorder': 'on order', 'loc.scrap': 'scrap',
  };

  function logFor(entities, events, entityId, opts = {}) {
    const scope = new Set(descendantsOf(entities, entityId));
    const label = id => {
      const item = entities[id];
      return item ? item.name + ' (' + item.serial + ')' : id;
    };

    return events
      .filter(e => scope.has(e.targetId))
      .filter(e => (!opts.from || e.at >= opts.from) && (!opts.to || e.at <= opts.to))
      .map(e => {
        const row = {
          at: e.at,
          kind: KIND_MAP[e.kind] ?? 'comment',
          info: e.payload.info ?? DEFAULT_INFO[e.kind] ?? e.kind,
          details: e.payload.text ?? e.payload.details ?? '',
          comment: e.payload.comment ?? '',
          by: e.by,
          raw: e,
        };
        // A bare "Installed" row says nothing useful. Name the part that
        // moved, and for a removal say where it went.
        if (e.kind === 'item.installed' || e.kind === 'item.removed') {
          row.details = label(e.payload.itemId);
          if (e.kind === 'item.removed' && e.payload.to) {
            row.comment = row.comment
              || 'Sent to ' + (LOCATION_NAME[e.payload.to] || e.payload.to);
          }
        } else if (e.kind === 'item.shipped' || e.kind === 'item.received') {
          row.details = label(e.targetId);
          if (e.payload.to) {
            row.comment = row.comment
              || (e.kind === 'item.received' ? 'Received into ' : 'Sent to ')
                 + (LOCATION_NAME[e.payload.to] || e.payload.to)
                 + (e.payload.leadTimeDays ? ' · ' + e.payload.leadTimeDays + ' day lead' : '');
          }
        }
        return row;
      })
      .sort((a, b) => (a.at < b.at ? 1 : a.at > b.at ? -1 : 0));
  }

  // What swapped between two dates. Drives the time-travel change markers.
  function changesBetween(entities, events, entityId, from, to) {
    const components = descendantsOf(entities, entityId)
      .filter(id => entities[id] && entities[id].kind === 'component');
    const out = [];
    for (const componentId of components) {
      const before = itemAt(events, componentId, from);
      const after = itemAt(events, componentId, to);
      if (before === after) continue;
      const swap = upto(events, to)
        .filter(e => e.targetId === componentId
                  && e.kind === 'item.installed'
                  && e.at > from)
        .pop();
      out.push({ componentId, fromItemId: before, toItemId: after, at: swap ? swap.at : to });
    }
    return out;
  }

  // --- inventory ----------------------------------------------------------

  // An item's location is derived, never stored. If it currently fills a
  // component slot it is on that slot's tool; otherwise its last shipping or
  // receiving event says where it went.
  function locationOf(entities, events, itemId, iso) {
    for (const [componentId, ent] of Object.entries(entities)) {
      if (ent.kind !== 'component') continue;
      if (itemAt(events, componentId, iso) !== itemId) continue;
      let node = entities[ent.parentId];
      while (node && node.kind !== 'tool') node = entities[node.parentId];
      return {
        locationKind: 'tool',
        locationLabel: node ? node.name : 'Unknown tool',
        componentId,
        leadTimeDays: null,
      };
    }

    // Shipping and receiving events target the item. A removal targets the
    // component and names the item in its payload — but it still says where
    // the item went, so it counts.
    let to = null, leadTimeDays = null;
    for (const e of upto(events, iso)) {
      const aboutThisItem = e.targetId === itemId
        || (e.kind === 'item.removed' && e.payload.itemId === itemId);
      if (!aboutThisItem) continue;
      if (e.kind === 'item.received' || e.kind === 'item.shipped'
          || e.kind === 'item.removed') {
        to = e.payload.to ?? to;
        leadTimeDays = e.payload.leadTimeDays ?? null;
      }
    }
    const locationKind = to === 'loc.storage' ? 'storage'
                       : to === 'loc.repair' ? 'repair'
                       : to === 'loc.onorder' ? 'onorder'
                       : to === 'loc.scrap' ? 'scrap'
                       : 'unknown';
    const locationLabel = {
      storage: 'In storage', repair: 'Out for repair', onorder: 'On order',
      scrap: 'Scrapped', unknown: 'Unknown',
    }[locationKind];
    return { locationKind, locationLabel, componentId: null, leadTimeDays };
  }

  // The deck is specific about this order: in storage first, then on another
  // tool, then on order. Serial breaks ties so the list is deterministic.
  const LOCATION_RANK = { storage: 0, tool: 1, onorder: 2, repair: 3, scrap: 4, unknown: 5 };
  const bySerial = (a, b) => (a.serial < b.serial ? -1 : a.serial > b.serial ? 1 : 0);

  function replacementCandidates(entities, events, componentId, iso) {
    const installed = itemAt(events, componentId, iso);
    const compatiblePNs = new Set(
      Object.values(entities)
        .filter(e => e.kind === 'partNumber'
                  && (e.compatibleComponentIds || []).includes(componentId))
        .map(p => p.id));

    return Object.values(entities)
      .filter(e => e.kind === 'item'
                && compatiblePNs.has(e.partNumberId)
                && e.id !== installed)
      .map(item => ({
        itemId: item.id,
        serial: item.serial,
        name: item.name,
        pn: entities[item.partNumberId] ? entities[item.partNumberId].pn : '',
        ...locationOf(entities, events, item.id, iso),
      }))
      .sort((a, b) =>
        (LOCATION_RANK[a.locationKind] - LOCATION_RANK[b.locationKind]) || bySerial(a, b));
  }

  // MFCs carry no compatibility list, so they get their own selector. Values
  // within a category are OR; categories combine with AND.
  function filterMFCs(entities, events, f = {}, iso) {
    return Object.values(entities)
      .filter(e => e.kind === 'item' && e.mfc)
      .filter(e => !(f.type && f.type.length) || f.type.includes(e.mfc.type))
      .filter(e => !(f.gas && f.gas.length) || f.gas.includes(e.mfc.gas))
      .filter(e => f.sccmMin == null || e.mfc.sccm >= f.sccmMin)
      .filter(e => f.sccmMax == null || e.mfc.sccm <= f.sccmMax)
      .map(e => ({ ...e, ...locationOf(entities, events, e.id, iso) }))
      .sort(bySerial);
  }

      text: 'Tool ramped down over the weekend from a water issue' },
      at(logStart, 300, 16));
    ev('state.changed', 't.gan11', { state: 'up',
      text: 'Water flow issue resolved, one leak located and sealed' },
      at(logStart, 312, 9));

    // GaN 12 is mid-rebuild. The System Notes timeline mentions exactly this.
    ev('state.changed', 't.gan12', { state: 'down',
      text: 'Rebuild for Gallium Nitride — boule build follows' },
      at(today, -70, 8));
    ev('state.changed', 't.gan13', { state: 'qual',
      text: 'Qualification runs for 150mm templates' },
      at(today, -25, 8));

    // -- component swaps ---------------------------------------------------
    // Four on GaN 11, one of them the O2 MFC so the date scrubber has
    // something visible to show.

    const swap = (componentId, dayFromToday, to, newItem) => {
      const when = at(today, dayFromToday, 11);
      const old = itemAt(events, componentId, when);
      if (old) ev('item.removed', componentId, { itemId: old, to }, when, 'paul');
      ev('item.installed', componentId, { itemId: newItem.id },
         at(today, dayFromToday, 12), 'paul');
    };

    const newO2 = mkMFC('O2', 200, 'sccm', 4);
    ev('item.received', newO2.id, { to: 'loc.storage' }, at(today, -200, 0), 'lori');
    swap('c.gan11.mfc.o2', -180, 'loc.repair', newO2);

    const newThrottle = mkItem('pn.throttle', 'Throttle Valve, 100mm ISO');
    ev('item.received', newThrottle.id, { to: 'loc.storage' }, at(today, -150, 0), 'lori');
    swap('c.gan11.throttle', -140, 'loc.repair', newThrottle);

    const newBaratron = mkItem('pn.baratron', 'Baratron capacitance manometer, 10 Torr');
    ev('item.received', newBaratron.id, { to: 'loc.storage' }, at(today, -95, 0), 'lori');
    swap('c.gan11.baratron', -88, 'loc.storage', newBaratron);

    const newSiH4 = mkMFC('SiH4', 20, 'sccm', 0);
    ev('item.received', newSiH4.id, { to: 'loc.storage' }, at(today, -60, 0), 'lori');
    swap('c.gan11.mfc.sih4', -52, 'loc.repair', newSiH4);

    events.sort((a, b) => (a.at < b.at ? -1 : a.at > b.at ? 1 : 0));

    return Object.freeze({ entities, events, today, users });
  })();

  // --- persistence --------------------------------------------------------
  //
  // The seed is frozen and never written to. Anything done in the browser is
  // appended to an overlay in localStorage and layered on at read time, so
  // Reset always returns the demo to a known state.

  const STORE_KEY = 'epitrax-poc-v1';

  function createStore(storage) {
    const read = () => {
      try {
        const raw = storage.getItem(STORE_KEY);
        const parsed = raw ? JSON.parse(raw) : [];
        return Array.isArray(parsed) ? parsed : [];
      } catch (err) {
        return [];
      }
    };
    return {
      events() {
        return [...SEED.events, ...read()]
          .sort((a, b) => (a.at < b.at ? -1 : a.at > b.at ? 1 : 0));
      },
      userEvents: read,
      append(event) {
        try {
          storage.setItem(STORE_KEY, JSON.stringify([...read(), event]));
        } catch (err) {
          // A full or unavailable store should not break the demo.
        }
        return event;
      },
      reset() {
        try { storage.removeItem(STORE_KEY); } catch (err) { /* ignore */ }
      },
    };
  }

  return {
    SEED, createStore,
    itemAt, stateAt, descendantsOf, healthOf, logFor, changesBetween,
    locationOf, replacementCandidates, filterMFCs, RED_STATES,
  };
})();
</script>

<body>
<header class="rail">
  <div class="brand">
    <div class="wordmark">EPITRAX</div>
    <div class="eyebrow">Maintenance Console · Prototype</div>
  </div>
  <nav class="crumbs" id="crumbs"></nav>
  <div class="railright">
    <label class="datewrap" title="View the floor as it was on this date">
      <span class="eyebrow">Viewing</span>
      <input type="date" id="asof">
    </label>
    <button class="btn" id="todayBtn">Today</button>
    <button class="btn warn" id="resetBtn" title="Discard changes made in this browser">Reset</button>
  </div>
</header>

<main id="main"></main>
<div id="modalRoot"></div>

<script id="ui">
(() => {
  'use strict';
  const E = globalThis.EpiTrax;
  const S = E.SEED;

  // --- tiny DOM helper ---------------------------------------------------
  function el(tag, attrs, ...kids) {
    const node = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v == null || v === false) continue;
      if (k === 'class') node.className = v;
      else if (k === 'html') node.innerHTML = v;
      else if (k.startsWith('on')) node.addEventListener(k.slice(2), v);
      else if (k === 'style') node.setAttribute('style', v);
      else node.setAttribute(k, v === true ? '' : v);
    }
    for (const kid of kids.flat(4)) {
      if (kid == null || kid === false) continue;
      node.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
    }
    return node;
  }
  const svg = (tag, attrs, ...kids) => {
    const node = document.createElementNS('http://www.w3.org/2000/svg', tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v == null || v === false) continue;
      if (k.startsWith('on')) node.addEventListener(k.slice(2), v);
      else node.setAttribute(k, v);
    }
    for (const kid of kids.flat(4)) if (kid != null && kid !== false) node.append(kid);
    return node;
  };

  // --- formatting --------------------------------------------------------
  const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const fmtDay = iso => {
    const d = new Date(iso);
    return d.getUTCDate() + ' ' + MONTHS[d.getUTCMonth()] + ' ' + d.getUTCFullYear();
  };
  const fmtStamp = iso => {
    const d = new Date(iso);
    let h = d.getUTCHours(); const ap = h >= 12 ? 'PM' : 'AM';
    h = h % 12 || 12;
    return (d.getUTCMonth() + 1) + '/' + d.getUTCDate() + '/' + d.getUTCFullYear()
      + ' ' + h + ':' + String(d.getUTCMinutes()).padStart(2, '0') + ' ' + ap;
  };
  const dayOf = iso => iso.slice(0, 10);
  const endOfDay = day => day + 'T23:59:59Z';
  const flow = m => (m.unit === 'slm' ? (m.sccm / 1000) + ' slm' : m.sccm + ' sccm');

  // --- app state ---------------------------------------------------------
  const store = E.createStore(safeLocalStorage());
  function safeLocalStorage() {
    try {
      const probe = '__epitrax__';
      window.localStorage.setItem(probe, '1');
      window.localStorage.removeItem(probe);
      return window.localStorage;
    } catch (err) {
      // Private mode or blocked site data. The demo still works, it just
      // forgets between reloads.
      const m = new Map();
      return { getItem: k => (m.has(k) ? m.get(k) : null),
               setItem: (k, v) => m.set(k, v), removeItem: k => m.delete(k) };
    }
  }

  let asOf = S.today;

  function ctx() {
    return { entities: S.entities, events: store.events(), at: asOf, store };
  }
  const isToday = () => dayOf(asOf) === dayOf(S.today);

  // --- routing -----------------------------------------------------------
  function parseHash() {
    const parts = (location.hash || '#/').replace(/^#\/?/, '').split('/');
    return { view: parts[0] || 'home', id: decodeURIComponent(parts[1] || '') };
  }
  const go = (view, id) =>
    { location.hash = '#/' + view + (id ? '/' + encodeURIComponent(id) : ''); };
  const link = (view, id) => ({ href: '#/' + view + (id ? '/' + encodeURIComponent(id) : '') });

  // Each view is `(root, ctx, id) => void`. Every one of them derives from
  // ctx.at, which is what makes the date scrubber work without per-view code.
  const VIEWS = {};

  const stub = name => (root) => root.append(
    el('div', { class: 'panel' }, el('h3', {}, name), el('p', { class: 'note' }, 'Not built yet.')));
  for (const v of ['home', 'facility', 'tool', 'subsystem', 'component', 'item', 'spares', 'across']) {
    VIEWS[v] = stub(v);
  }

  // --- facility ----------------------------------------------------------
  //
  // Drawn as bays rather than the source deck's building floorplan. The POC
  // needs tool positions, not their architecture.

  const BAYS = [
    ['hvpe', 'HVPE Bay'],
    ['pvd', 'PVD Bay'],
    ['furnace', 'Furnace / MOCVD'],
  ];

  // The deck maps four states onto red. Colour alone would lose that, so
  // every tile also carries its state as text.
  const STATE_LABEL = {
    up: 'Up', down: 'Down', decommissioned: 'Decomm', qual: 'Qual', pm: 'PM',
  };

  function toolStatus(c, toolId) {
    const health = E.healthOf(c.entities, c.events, toolId, c.at);
    const state = E.stateAt(c.events, c.at).toolStates[toolId] || 'up';
    const openCount = E.stateAt(c.events, c.at).openIssues
      .concat(E.stateAt(c.events, c.at).openWOs)
      .filter(o => new Set(E.descendantsOf(c.entities, toolId)).has(o.targetId)).length;
    return { health, state, openCount };
  }

  function toolTile(c, tool) {
    const { health, state, openCount } = toolStatus(c, tool.id);
    const label = health === 'red'
      ? (STATE_LABEL[state] || state).toUpperCase()
      : (openCount ? 'Up · attention' : 'Up');
    return el('a', { class: 'tile t-' + health, ...link('tool', tool.id) },
      el('span', { class: 'tile-accent' }),
      openCount ? el('span', { class: 'tile-badge' }, openCount) : null,
      el('div', { class: 'tile-name' }, tool.name),
      el('div', { class: 'tile-state' }, label),
      el('div', { class: 'tile-sub' }, tool.family + (tool.modelled ? ' · modelled' : '')));
  }

  VIEWS.facility = (root, c) => {
    const tools = Object.values(c.entities).filter(e => e.kind === 'tool');
    const counts = { green: 0, amber: 0, red: 0 };
    tools.forEach(t => { counts[E.healthOf(c.entities, c.events, t.id, c.at)] += 1; });

    root.append(el('div', { class: 'viewhead' },
      el('div', { class: 'viewtitle' }, 'Facility'),
      el('div', { class: 'eyebrow' },
        counts.green + ' up · ' + counts.amber + ' with open work · ' + counts.red + ' not running')));

    root.append(el('div', { class: 'bays' },
      BAYS.map(([bay, name]) => el('section', { class: 'bay' },
        el('div', { class: 'bay-name' }, name),
        el('div', { class: 'tiles' },
          tools.filter(t => t.bay === bay).map(t => toolTile(c, t)))))));

    root.append(el('div', { class: 'legend' },
      el('span', {}, el('i', { class: 'dot s-green' }), 'Up, no open issues'),
      el('span', {}, el('i', { class: 'dot s-amber' }), 'Up, open issue or work order'),
      el('span', {}, el('i', { class: 'dot s-red' }), 'Down, decommissioned, qual or PM'),
      el('span', { class: 'note' },
        'Bay layout is illustrative. Only GaN 11 is modelled to component level.')));
  };

  // --- shared: the log panel ---------------------------------------------
  //
  // Four columns matching the tool-log screenshot in the deck — StartDate,
  // Info, Details, Comment — with rows tinted by kind.

  function logPanel(c, entityId, opts) {
    const o = opts || {};
    const rows = E.logFor(c.entities, c.events, entityId, { to: c.at });
    const limit = o.limit || 60;
    const shown = rows.slice(0, limit);

    const table = el('table', { class: 'log' },
      el('thead', {}, el('tr', {},
        el('th', {}, 'StartDate'), el('th', {}, 'Info'),
        el('th', {}, 'Details'), el('th', {}, 'Comment'), el('th', {}, 'By'))),
      el('tbody', {}, shown.map(r => el('tr', { class: 'r-' + r.kind },
        el('td', { class: 'mono nowrap' }, fmtStamp(r.at)),
        el('td', {}, r.info),
        el('td', {}, r.details),
        el('td', { class: 'muted' }, r.comment),
        el('td', { class: 'mono muted' }, r.by)))));

    return el('section', { class: 'panel' },
      el('h3', {}, o.title || 'Log'),
      rows.length
        ? el('div', { class: 'tablewrap' }, table)
        : el('p', { class: 'note' }, 'Nothing recorded yet.'),
      rows.length > limit
        ? el('p', { class: 'note', style: 'margin:9px 0 0' },
            'Showing the most recent ' + limit + ' of ' + rows.length + ' entries.')
        : null);
  }

  // --- shared: action bar -------------------------------------------------
  // ACTIONS is populated by the actions section further down.
  const ACTIONS = {};

  function actionButtons(c, entityId, extra) {
    const ent = c.entities[entityId];
    const buttons = [
      ['Report Issue', 'reportIssue', 'primary'],
      ['Record Maintenance', 'recordMaintenance', ''],
      ['View Log', 'viewLog', ''],
    ];
    if (ent && ent.kind === 'tool' && ent.modelled) {
      buttons.unshift(['Rebuild', 'rebuild', ''], ['Refill', 'refill', '']);
    }
    return [
      ...(extra || []),
      ...buttons.map(([label, key, cls]) => el('button', {
        class: 'btn ' + cls,
        onclick: () => (ACTIONS[key] || (() => {}))(c, entityId),
      }, label)),
    ];
  }

  // --- tool --------------------------------------------------------------
  //
  // Reproduces the slide-18 mockup: whiteboard, two columns of buttons
  // flanking the reactor, rotation and lift below it, actions at the foot.

  // [label, entityId, isSubsystem]. Order is the slide's top-to-bottom order.
  const GAN11_LEFT = [
    ['Top Flange', 'c.gan11.topflange', false],
    ['Gas Panel', 's.gan11.gaspanel', true],
    ['Controls', 's.gan11.controls', true],
    ['Electric', 's.gan11.electric', true],
    ['Water Manifold', 'c.gan11.watermanifold', false],
    ['Bottom Flange', 'c.gan11.botflange', false],
    ['Convectron', 'c.gan11.convectron', false],
    ['Baratron', 'c.gan11.baratron', false],
  ];
  const GAN11_RIGHT = [
    ['Precursors', 'c.gan11.precursors', false],
    ['Quartz', 'c.gan11.quartz', false],
    ['Furnace Assembly', 's.gan11.furnace', true],
    ['Trap Assembly', 's.gan11.exhaust', true],
    ['Throttle Valve', 'c.gan11.throttle', false],
    ['Dry Pump', 'c.gan11.drypump', false],
  ];
  const GAN11_LOWER = [
    ['Rotation', 'c.gan11.rotation', false],
    ['Lift', 'c.gan11.lift', false],
  ];

  function nodeButton(c, [label, id, isSub]) {
    const ent = c.entities[id];
    if (!ent) return null;
    const health = E.healthOf(c.entities, c.events, id, c.at);
    const view = isSub ? 'subsystem' : 'component';
    const installed = !isSub ? c.entities[E.itemAt(c.events, id, c.at)] : null;
    const meta = isSub
      ? Object.values(c.entities).filter(e => e.parentId === id).length + ' items'
      : (installed ? installed.serial : 'no item');
    const node = el('a', {
      class: 'node n-' + health + (isSub ? ' is-sub' : ''),
      ...link(view, id),
      onmouseenter: ev => showHover(ev.currentTarget, c, id, label),
      onmouseleave: hideHover,
    },
      el('div', { class: 'node-name' }, label),
      el('div', { class: 'node-meta' }, meta));
    return node;
  }

  // Hovering a subsystem lists what is inside it and anything open, which the
  // deck asks for explicitly.
  let hoverEl = null;
  function hideHover() {
    if (hoverEl) { hoverEl.remove(); hoverEl = null; }
  }
  function showHover(anchor, c, id, label) {
    hideHover();
    const kids = Object.values(c.entities).filter(e => e.parentId === id);
    const st = E.stateAt(c.events, c.at);
    const scope = new Set(E.descendantsOf(c.entities, id));
    const open = [...st.openIssues, ...st.openWOs].filter(o => scope.has(o.targetId));
    if (!kids.length && !open.length) return;
    const card = el('div', { class: 'hovercard' },
      el('h4', {}, label),
      kids.length ? el('ul', {}, kids.slice(0, 9).map(k =>
        el('li', {}, k.empty ? 'Empty slot' : k.name))) : null,
      kids.length > 9 ? el('div', { class: 'note' }, '+' + (kids.length - 9) + ' more') : null,
      open.length ? el('div', { style: 'margin-top:7px;color:var(--warn)' },
        open.length + ' open ' + (open.length === 1 ? 'item' : 'items')) : null);
    document.body.append(card);
    const r = anchor.getBoundingClientRect();
    const top = Math.min(r.top + window.scrollY, window.scrollY + window.innerHeight - card.offsetHeight - 12);
    card.style.top = top + 'px';
    card.style.left = Math.min(r.right + 10, window.innerWidth - card.offsetWidth - 12) + 'px';
    hoverEl = card;
  }

  // The whiteboard placeholders from the slide. Values that live in the model
  // are derived; the rest are plausible constants, which is what the deck's
  // braces stand for.
  function whiteboard(c, toolId) {
    const st = E.stateAt(c.events, c.at);
    const quartz = c.entities[E.itemAt(c.events, 'c.gan11.quartz', c.at)];
    const boat = c.entities[E.itemAt(c.events, 'c.gan11.sourceboat', c.at)];
    const runs = E.logFor(c.entities, c.events, toolId, { to: c.at })
      .filter(r => r.kind === 'run');
    const lastRun = runs[0];
    const buildSize = quartz && /(\d+)\s*in/.test(quartz.name)
      ? RegExp.$1 + ' in' : '4 in';
    const scope = new Set(E.descendantsOf(c.entities, toolId));
    const open = [...st.openIssues, ...st.openWOs].filter(o => scope.has(o.targetId));
    const lastComment = E.logFor(c.entities, c.events, toolId, { to: c.at })
      .find(r => r.comment);

    const rows = [
      ['Build size / #', buildSize + ' · ' + (lastRun ? lastRun.details : '—')],
      ['Charge code', lastRun ? lastRun.info.replace('Ran: ', '') : '—'],
      ['Dopant', 'SiH4 · 2.1e18 cm⁻³'],
      ['Rod height', '318 mm'],
      ['Base pressure', '4.2e-3 Torr'],
      ['Source serial', boat ? boat.serial : '—'],
      ['Ga level est.', '612 g'],
      ['Idle temps', '480 / 1035 °C'],
    ];

    return el('section', { class: 'whiteboard' },
      el('h3', {}, 'Whiteboard'),
      rows.map(([k, v]) => el('div', { class: 'wb-row' },
        el('span', { class: 'wb-k' }, k), el('span', { class: 'wb-v' }, v))),
      el('div', { class: 'wb-issues' },
        el('div', { class: 'wb-k' }, 'Open issues'),
        open.length
          ? open.map(o => {
              const ent = c.entities[o.targetId];
              const view = ent && ent.kind === 'subsystem' ? 'subsystem'
                         : ent && ent.kind === 'tool' ? 'tool' : 'component';
              return el('a', { class: 'wb-issue', ...link(view, o.targetId) },
                (ent ? ent.name : o.targetId) + ' — ' + o.text);
            })
          : el('div', { class: 'note', style: 'margin-top:4px' }, 'None')),
      lastComment
        ? el('div', { class: 'wb-comment' }, '“' + lastComment.comment + '”')
        : null);
  }

  VIEWS.tool = (root, c, id) => {
    const tool = c.entities[id];
    if (!tool || tool.kind !== 'tool') { go('facility'); return; }
    const { health, state } = toolStatus(c, tool.id);

    root.append(el('div', { class: 'viewhead' },
      el('div', { class: 'viewtitle' }, tool.name),
      el('span', { class: 'toolstate st-' + health },
        health === 'red' ? (STATE_LABEL[state] || state) : 'Up'),
      el('span', { class: 'eyebrow' }, tool.family)));

    if (!tool.modelled) {
      root.append(el('div', { class: 'panel' },
        el('h3', {}, 'Not modelled in this prototype'),
        el('p', { class: 'note' },
          'Only GaN 11 carries a schematic and a full component tree. '
          + tool.name + ' shows its log and status below.'),
        el('div', { class: 'toolbar', style: 'margin-top:12px' },
          actionButtons(c, tool.id))));
      root.append(el('div', { style: 'margin-top:14px' }, logPanel(c, tool.id)));
      return;
    }

    root.append(el('div', { class: 'toolbar' }, actionButtons(c, tool.id)));

    root.append(el('div', { class: 'toolwrap' },
      whiteboard(c, tool.id),
      el('div', { class: 'btncol' }, GAN11_LEFT.map(b => nodeButton(c, b))),
      el('div', { class: 'stage' },
        el('div', { class: 'reactor' }),
        el('div', { class: 'stage-lower' }, GAN11_LOWER.map(b => nodeButton(c, b))),
        el('div', { class: 'stage-caption' }, 'HVPE reactor · GaN 11')),
      el('div', { class: 'btncol' }, GAN11_RIGHT.map(b => nodeButton(c, b)))));

    root.append(el('div', { style: 'margin-top:16px' }, logPanel(c, tool.id)));
  };

  // --- subsystem ---------------------------------------------------------

  // Channel order and class, in the order slide 19 lists them.
  const CHANNELS = [
    ['Ga Run', 'ch-ga'],
    ['Outer Diluent', 'ch-od'],
    ['Inner Diluent 1', 'ch-id1'],
    ['O2 Run', 'ch-o2'],
    ['Inner Diluent 2', 'ch-id2'],
    ['Dump Tube', 'ch-dump'],
  ];

  function mfcRow(c, comp) {
    if (comp.empty) {
      return el('div', { class: 'mfcrow empty' },
        el('span', { class: 'mfc-gas' }, '— empty slot —'),
        el('span', { class: 'mfc-size' }, '—'));
    }
    const health = E.healthOf(c.entities, c.events, comp.id, c.at);
    const item = c.entities[E.itemAt(c.events, comp.id, c.at)];
    return el('a', { class: 'mfcrow n-' + health, ...link('component', comp.id) },
      el('span', { class: 'mfc-gas' }, comp.name),
      el('span', { class: 'mfc-serial' }, item ? item.serial : '—'),
      el('span', { class: 'mfc-size' }, item && item.mfc ? flow(item.mfc) : 'none'));
  }

  function gasPanel(root, c, sub) {
    const comps = Object.values(c.entities)
      .filter(e => e.parentId === sub.id)
      .sort((a, b) => a.order - b.order);

    const left = el('div', {});
    for (const [channel, cls] of CHANNELS) {
      const rows = comps.filter(x => x.channel === channel);
      if (!rows.length) continue;
      left.append(el('div', { class: 'chan ' + cls },
        el('div', { class: 'chan-rows' }, rows.map(x => mfcRow(c, x))),
        el('div', { class: 'chan-label' }, channel)));
    }

    root.append(el('div', { class: 'panelwrap' },
      el('section', { class: 'panel' },
        el('h3', {}, 'Mass flow controllers · by channel'),
        left,
        el('p', { class: 'note', style: 'margin:10px 0 0' },
          'Background indicates which channel the gas flows in. '
          + 'Empty slots are shown rather than hidden.')),
      logPanel(c, sub.id, { limit: 40 })));
  }

  function genericSubsystem(root, c, sub) {
    const comps = Object.values(c.entities).filter(e => e.parentId === sub.id);
    root.append(el('div', { class: 'panelwrap' },
      el('section', { class: 'panel' },
        el('h3', {}, 'Components'),
        comps.length
          ? el('div', { class: 'compgrid' }, comps.map(comp => {
              const health = E.healthOf(c.entities, c.events, comp.id, c.at);
              const item = c.entities[E.itemAt(c.events, comp.id, c.at)];
              return el('a', { class: 'node n-' + health, ...link('component', comp.id) },
                el('div', { class: 'node-name' }, comp.name),
                el('div', { class: 'node-meta' }, item ? item.serial : 'no item'));
            }))
          : el('p', { class: 'note' }, 'No components modelled on this subsystem.')),
      logPanel(c, sub.id, { limit: 40 })));
  }

  VIEWS.subsystem = (root, c, id) => {
    const sub = c.entities[id];
    if (!sub || sub.kind !== 'subsystem') { go('facility'); return; }
    const tool = c.entities[sub.parentId];
    const health = E.healthOf(c.entities, c.events, id, c.at);

    root.append(el('div', { class: 'viewhead' },
      el('div', { class: 'viewtitle' }, sub.name),
      el('span', { class: 'toolstate st-' + health },
        health === 'green' ? 'No open work' : 'Open work'),
      el('span', { class: 'eyebrow' }, tool ? tool.name : '')));

    root.append(el('div', { class: 'toolbar' }, actionButtons(c, id)));

    if (Object.values(c.entities).some(e => e.parentId === id && e.isMFC)) {
      gasPanel(root, c, sub);
    } else {
      genericSubsystem(root, c, sub);
    }
  };

  // --- component ---------------------------------------------------------

  function toolOf(entities, id) {
    let node = entities[id];
    while (node && node.kind !== 'tool') node = entities[node.parentId];
    return node;
  }

  // The Subsystem / Component picker from slides 20 and 21.
  function picker(c, comp) {
    const tool = toolOf(c.entities, comp.id);
    const subs = Object.values(c.entities)
      .filter(e => e.kind === 'subsystem' && e.parentId === tool.id);
    const currentSub = c.entities[comp.parentId];
    const comps = Object.values(c.entities)
      .filter(e => e.kind === 'component' && e.parentId === currentSub.id)
      .sort((a, b) => (a.order ?? 99) - (b.order ?? 99));

    const row = (ent, selected, view) => el('a', {
      class: 'pickrow' + (selected ? ' sel' : ''), ...link(view, ent.id),
    },
      el('i', { class: 'dot pdot s-' + E.healthOf(c.entities, c.events, ent.id, c.at) }),
      ent.empty ? 'Empty slot' : ent.name);

    return el('section', { class: 'panel' },
      el('h3', {}, 'Navigate'),
      el('div', { class: 'picker' },
        el('div', {},
          el('h4', {}, 'Subsystem'),
          el('div', { class: 'picklist' },
            subs.map(s => row(s, s.id === currentSub.id, 'subsystem')))),
        el('div', {},
          el('h4', {}, 'Component'),
          el('div', { class: 'picklist' },
            comps.map(x => x.empty
              ? el('span', { class: 'pickrow', style: 'opacity:.4' }, 'Empty slot')
              : row(x, x.id === comp.id, 'component'))))));
  }

  function openWorkPanel(c, entityId) {
    const st = E.stateAt(c.events, c.at);
    const scope = new Set(E.descendantsOf(c.entities, entityId));
    const issues = st.openIssues.filter(o => scope.has(o.targetId));
    const wos = st.openWOs.filter(o => scope.has(o.targetId));

    const rowFor = (o, isWO) => el('div', { class: 'openrow' + (isWO ? ' iswo' : '') },
      el('div', { class: 'otxt' }, o.text,
        el('div', { class: 'ometa' },
          fmtDay(o.at) + ' · ' + o.by
          + (o.itemId && c.entities[o.itemId] ? ' · on ' + c.entities[o.itemId].serial : ''))),
      el('span', { class: 'chip' }, isWO ? 'WO' : 'Issue'),
      el('button', {
        class: 'btn',
        onclick: () => (ACTIONS.closeOne || (() => {}))(c, o, isWO),
      }, 'Close'));

    return el('section', { class: 'panel' },
      el('h3', {}, 'Open issues and work orders'),
      (issues.length || wos.length)
        ? el('div', { class: 'openlist' },
            issues.map(o => rowFor(o, false)), wos.map(o => rowFor(o, true)))
        : el('p', { class: 'note' }, 'Nothing open here.'));
  }

  VIEWS.component = (root, c, id) => {
    const comp = c.entities[id];
    if (!comp || comp.kind !== 'component') { go('facility'); return; }
    const tool = toolOf(c.entities, comp.id);
    const sub = c.entities[comp.parentId];
    const health = E.healthOf(c.entities, c.events, id, c.at);
    const item = c.entities[E.itemAt(c.events, id, c.at)];
    const pn = item ? c.entities[item.partNumberId] : null;

    root.append(el('div', { class: 'viewhead' },
      el('div', { class: 'viewtitle' }, tool.name + ' ' + comp.name),
      el('span', { class: 'toolstate st-' + health },
        health === 'green' ? 'No open work' : 'Open work'),
      el('span', { class: 'eyebrow' }, sub.name)));

    const extra = [];
    if (item) {
      extra.push(el('button', {
        class: 'btn',
        onclick: () => (ACTIONS.replace || (() => {}))(c, id),
      }, comp.isMFC ? 'MFC Selector' : 'Replace Component'));
    }
    root.append(el('div', { class: 'toolbar' }, actionButtons(c, id, extra)));

    const left = el('div', {});
    left.append(el('div', { class: 'installed' },
      el('div', { class: 'lbl' }, 'Currently installed'),
      item
        ? el('div', {},
            el('div', { class: 'val' }, item.name),
            el('div', { class: 'pn' }, pn ? pn.pn : ''),
            el('div', { style: 'margin-top:7px' },
              el('span', { class: 'lbl' }, 'Serial # '),
              el('a', { class: 'serial-link', ...link('item', item.id) }, item.serial)),
            item.mfc
              ? el('div', { class: 'pn', style: 'margin-top:5px' },
                  flow(item.mfc) + ' · ' + item.mfc.gas + ' · type ' + item.mfc.type)
              : null)
        : el('div', { class: 'note', style: 'margin-top:4px' }, 'No item installed.')));
    left.append(picker(c, comp));

    root.append(el('div', { class: 'compwrap' },
      left,
      el('div', {},
        openWorkPanel(c, id),
        el('div', { style: 'margin-top:14px' }, logPanel(c, id, { title: 'Component log' })))));
  };

  // --- item --------------------------------------------------------------
  //
  // One serialized object across its whole life: every slot it has occupied,
  // every tool it has lived on, and the events it inherited while installed.

  VIEWS.item = (root, c, id) => {
    const item = c.entities[id];
    if (!item || item.kind !== 'item') { go('spares'); return; }
    const pn = c.entities[item.partNumberId];
    const loc = E.locationOf(c.entities, c.events, id, c.at);

    root.append(el('div', { class: 'viewhead' },
      el('div', { class: 'viewtitle' }, item.serial),
      el('span', { class: 'eyebrow' }, item.name)));

    // Where it has been, built by replaying its install and removal events.
    const stops = [];
    for (const e of c.events) {
      if (e.at > c.at) break;
      if (e.kind === 'item.installed' && e.payload.itemId === id) {
        const comp = c.entities[e.targetId];
        stops.push({ at: e.at, on: true, by: e.by,
          what: 'Installed on ' + (toolOf(c.entities, e.targetId) || {}).name
                + ' · ' + (comp ? comp.name : e.targetId),
          componentId: e.targetId });
      }
      if (e.kind === 'item.removed' && e.payload.itemId === id) {
        const comp = c.entities[e.targetId];
        stops.push({ at: e.at, on: false, by: e.by,
          what: 'Removed from ' + (comp ? comp.name : e.targetId)
                + ' → ' + (LOC_LABEL[e.payload.to] || 'unknown'),
          componentId: e.targetId });
      }
      if ((e.kind === 'item.received' || e.kind === 'item.shipped') && e.targetId === id) {
        stops.push({ at: e.at, on: e.kind === 'item.received', by: e.by,
          what: (e.kind === 'item.received' ? 'Received into ' : 'Sent to ')
                + (LOC_LABEL[e.payload.to] || 'unknown')
                + (e.payload.leadTimeDays ? ' · ' + e.payload.leadTimeDays + ' day lead' : '') });
      }
    }
    stops.reverse();

    // Events that happened on a component while this item was in the slot.
    const inherited = [];
    for (const e of c.events) {
      if (e.at > c.at) break;
      if (!['issue.opened', 'issue.closed', 'wo.opened', 'wo.closed'].includes(e.kind)) continue;
      if (E.itemAt(c.events, e.targetId, e.at) !== id) continue;
      inherited.push(e);
    }
    inherited.reverse();

    root.append(el('div', { class: 'compwrap' },
      el('div', {},
        el('section', { class: 'panel' },
          el('h3', {}, 'This item'),
          el('div', { class: 'installed', style: 'margin-bottom:0' },
            el('div', { class: 'lbl' }, 'Part number'),
            el('div', { class: 'val' }, pn ? pn.pn : '—'),
            el('div', { class: 'pn' }, pn ? pn.description : ''),
            el('div', { style: 'margin-top:9px' },
              el('span', { class: 'lbl' }, 'Location '),
              el('span', { class: 'mono' }, loc.locationLabel)),
            item.mfc
              ? el('div', { class: 'pn', style: 'margin-top:6px' },
                  flow(item.mfc) + ' · ' + item.mfc.gas + ' · type ' + item.mfc.type)
              : null,
            item.lot
              ? el('div', { class: 'pn', style: 'margin-top:6px' }, 'Lot ' + item.lot)
              : null)),
        el('section', { class: 'panel', style: 'margin-top:14px' },
          el('h3', {}, 'Where it has been'),
          stops.length
            ? el('ul', { class: 'tl' }, stops.map(s => el('li', { class: s.on ? 'on' : 'off' },
                el('div', { class: 'tl-when' }, fmtDay(s.at) + ' · ' + s.by),
                s.componentId
                  ? el('a', { class: 'tl-what serial-link', ...link('component', s.componentId) }, s.what)
                  : el('div', { class: 'tl-what' }, s.what))))
            : el('p', { class: 'note' }, 'No movement recorded.'))),
      el('div', {},
        el('section', { class: 'panel' },
          el('h3', {}, 'Inherited while installed'),
          inherited.length
            ? el('ul', { class: 'tl' }, inherited.map(e => el('li', {},
                el('div', { class: 'tl-when' }, fmtDay(e.at) + ' · ' + e.by),
                el('div', { class: 'tl-what' },
                  (DEFAULT_KIND_LABEL[e.kind] || e.kind) + ' — '
                  + (e.payload.text || c.entities[e.targetId]?.name || '')))))
            : el('p', { class: 'note' },
                'Nothing was raised against a slot while this item filled it.')))));
  };

  const LOC_LABEL = {
    'loc.storage': 'storage', 'loc.repair': 'repair',
    'loc.onorder': 'on order', 'loc.scrap': 'scrap',
  };
  const DEFAULT_KIND_LABEL = {
    'issue.opened': 'Issue opened', 'issue.closed': 'Issue closed',
    'wo.opened': 'Work order opened', 'wo.closed': 'Work order closed',
  };

  function render() {
    const { view, id } = parseHash();
    const c = ctx();
    const main = document.getElementById('main');
    main.replaceChildren();
    const fn = VIEWS[view] || VIEWS.home;
    try {
      fn(main, c, id);
    } catch (err) {
      main.append(el('div', { class: 'panel' },
        el('h3', {}, 'This view failed to render'),
        el('pre', { class: 'mono' }, String(err && err.stack || err))));
      throw err;
    }
    renderCrumbs(c, view, id);
    document.getElementById('asof').value = dayOf(asOf);
    document.body.classList.toggle('past', !isToday());
  }

  // --- breadcrumb --------------------------------------------------------
  const VIEW_FOR_KIND = { tool: 'tool', subsystem: 'subsystem', component: 'component', item: 'item' };

  function ancestry(entities, id) {
    const chain = [];
    let node = entities[id];
    while (node) { chain.unshift(node); node = node.parentId ? entities[node.parentId] : null; }
    return chain;
  }

  function renderCrumbs(c, view, id) {
    const nav = document.getElementById('crumbs');
    nav.replaceChildren();
    const crumbs = [['Home', 'home', '']];
    if (view !== 'home') crumbs.push(['Facility', 'facility', '']);

    if (view === 'item') {
      const item = c.entities[id];
      crumbs.push(['Spares', 'spares', '']);
      if (item) crumbs.push([item.serial, 'item', id]);
    } else if (c.entities[id]) {
      for (const node of ancestry(c.entities, id)) {
        crumbs.push([node.name, VIEW_FOR_KIND[node.kind] || 'facility', node.id]);
      }
    } else if (view === 'spares') {
      crumbs.push(['Spares', 'spares', '']);
    } else if (view === 'across') {
      crumbs.push(['Cross-tool history', 'across', '']);
    }

    crumbs.forEach(([label, v, cid], i) => {
      if (i) nav.append(el('span', { class: 'crumb-sep' }, '/'));
      const here = i === crumbs.length - 1;
      nav.append(el('a', { class: 'crumb' + (here ? ' here' : ''), ...link(v, cid) }, label));
    });
  }

  // --- shell wiring ------------------------------------------------------
  document.getElementById('asof').addEventListener('change', e => {
    const day = e.target.value;
    if (!day) return;
    asOf = dayOf(S.today) === day ? S.today : endOfDay(day);
    render();
  });
  document.getElementById('todayBtn').addEventListener('click', () => {
    asOf = S.today; render();
  });
  document.getElementById('resetBtn').addEventListener('click', () => {
    store.reset(); asOf = S.today; render();
  });
  window.addEventListener('hashchange', render);

  // Exposed so the view sections below can register themselves.
  globalThis.EpiTraxUI = {
    el, svg, VIEWS, render, go, link, ctx, store,
    fmtDay, fmtStamp, dayOf, flow, ancestry, isToday,
    get asOf() { return asOf; },
    set asOf(v) { asOf = v; },
  };

  document.getElementById('asof').max = dayOf(S.today);
  document.getElementById('asof').min = dayOf(S.events[0].at);
  render();
})();
</script>
</body>
