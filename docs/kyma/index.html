<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EpiTrax Maintenance Console — Prototype</title>
<meta name="theme-color" content="#0B1012">
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><rect width="32" height="32" fill="%230B1012"/><rect x="5" y="5" width="9" height="9" fill="%2300B050"/><rect x="18" y="5" width="9" height="9" fill="%23FFC000"/><rect x="5" y="18" width="9" height="9" fill="%23FFC000"/><rect x="18" y="18" width="9" height="9" fill="%23C00000"/></svg>'>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
:root{
  --deep:#0B1012; --slate:#131A1C; --rise:#1B2427; --rise2:#222D31;
  --line:#2C3A3E; --line-soft:#212C2F;
  --chalk:#F2F0EA; --mute:#8FA0A4; --mute2:#65787D;
  --amber:#FFB020;
  --up:#00B050; --warn:#FFC000; --down:#C00000;
  --display:'Oswald',Impact,'Arial Narrow',sans-serif;
  --body:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--deep); color:var(--chalk); font-family:var(--body);
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none;font-size:inherit}
input,select{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
a{color:inherit;text-decoration:none}

.eyebrow{
  font-family:var(--mono);font-size:10px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--mute2)
}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.num{font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums}

/* ---------- top rail ---------- */
.rail{
  display:flex;align-items:center;gap:22px;
  padding:10px 18px;background:var(--slate);
  border-bottom:1px solid var(--line);
  position:sticky;top:0;z-index:40;flex-wrap:wrap;
}
.wordmark{
  font-family:var(--display);font-weight:700;font-size:20px;
  letter-spacing:.06em;line-height:1
}
.brand .eyebrow{margin-top:2px}
.crumbs{display:flex;align-items:center;gap:6px;flex:1;flex-wrap:wrap;min-width:200px}
.crumb{
  font-family:var(--mono);font-size:11.5px;color:var(--mute);
  padding:3px 7px;border-radius:3px
}
.crumb:hover{background:var(--rise);color:var(--chalk)}
.crumb.here{color:var(--chalk);background:var(--rise2)}
.crumb-sep{color:var(--mute2);font-size:11px}
.railright{display:flex;align-items:center;gap:10px}

.datewrap{
  display:flex;align-items:center;gap:8px;background:var(--rise);
  border:1px solid var(--line);border-radius:4px;padding:4px 8px
}
.datewrap input{
  background:none;border:0;color:var(--chalk);font-family:var(--mono);font-size:12px
}
.datewrap input::-webkit-calendar-picker-indicator{filter:invert(.7)}
.btn{
  border:1px solid var(--line);background:var(--rise);border-radius:4px;
  padding:5px 11px;font-size:12px;color:var(--mute)
}
.btn:hover{background:var(--rise2);color:var(--chalk);border-color:var(--mute2)}
.btn.primary{border-color:var(--amber);color:var(--amber)}
.btn.primary:hover{background:var(--amber);color:var(--deep)}
.btn.warn:hover{background:var(--down);color:var(--chalk);border-color:var(--down)}

/* ---------- layout ---------- */
main{padding:20px 18px 60px;max-width:1500px;margin:0 auto}
.viewhead{display:flex;align-items:baseline;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.viewtitle{font-family:var(--display);font-weight:500;font-size:26px;letter-spacing:.02em}
.panel{
  background:var(--slate);border:1px solid var(--line);
  border-radius:5px;padding:14px 16px
}
.panel h3{
  margin:0 0 10px;font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--mute2);font-weight:500
}
.grid{display:grid;gap:14px}
.note{color:var(--mute2);font-size:12px;font-style:italic}

/* ---------- status ---------- */
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.s-green{background:var(--up)} .s-amber{background:var(--warn)} .s-red{background:var(--down)}
.bar-green{border-left:3px solid var(--up)}
.bar-amber{border-left:3px solid var(--warn)}
.bar-red{border-left:3px solid var(--down)}

/* ---------- facility ---------- */
.bays{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start}
.bay{
  background:var(--slate);border:1px solid var(--line);border-radius:5px;
  padding:12px 13px 14px;flex:1 1 300px
}
.bay-name{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--mute2);margin-bottom:10px
}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:9px}
.tile{
  background:var(--rise);border:1px solid var(--line);border-radius:4px;
  padding:10px 11px;text-align:left;display:block;position:relative;overflow:hidden
}
.tile:hover{background:var(--rise2);border-color:var(--mute2)}
.tile-accent{position:absolute;left:0;top:0;bottom:0;width:3px}
.tile-name{font-family:var(--display);font-weight:500;font-size:17px;letter-spacing:.02em}
.tile-state{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;
  text-transform:uppercase;margin-top:3px
}
.tile-sub{font-size:11px;color:var(--mute2);margin-top:5px}
.tile-badge{
  position:absolute;top:8px;right:8px;font-family:var(--mono);font-size:10px;
  background:var(--warn);color:#241a00;border-radius:9px;padding:1px 6px;font-weight:600
}
.t-green .tile-state{color:var(--up)}
.t-amber .tile-state{color:var(--warn)}
.t-red .tile-state{color:var(--down)}
.t-green .tile-accent{background:var(--up)}
.t-amber .tile-accent{background:var(--warn)}
.t-red .tile-accent{background:var(--down)}

.legend{display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin-top:14px}
.legend span{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--mute)}
</style>

<script id="engine">
globalThis.EpiTrax = (() => {
  'use strict';

  // Events sorted and clipped to a point in time. Every derived view starts
  // here: nothing is stored, everything is replayed.
  const upto = (events, iso) =>
    events
      .filter(e => e.at <= iso)
      .sort((a, b) => (a.at < b.at ? -1 : a.at > b.at ? 1 : 0));

  // Which serialized item occupied this slot at a given moment.
  function itemAt(events, componentId, iso) {
    let current = null;
    for (const e of upto(events, iso)) {
      if (e.targetId !== componentId) continue;
      if (e.kind === 'item.installed') current = e.payload.itemId;
      if (e.kind === 'item.removed') current = null;
    }
    return current;
  }

  function stateAt(events, iso) {
    const installed = {};
    const issues = new Map();
    const wos = new Map();
    const toolStates = {};

    for (const e of upto(events, iso)) {
      switch (e.kind) {
        case 'item.installed':
          installed[e.targetId] = e.payload.itemId;
          break;
        case 'item.removed':
          installed[e.targetId] = null;
          break;
        case 'issue.opened':
          // An issue binds to whatever item was in the slot at the time. It
          // keeps that binding even after the item is swapped out.
          issues.set(e.id, {
            id: e.id, targetId: e.targetId, text: e.payload.text,
            at: e.at, by: e.by, itemId: installed[e.targetId] ?? null,
          });
          break;
        case 'issue.closed':
          issues.delete(e.payload.issueId);
          break;
        case 'wo.opened':
          wos.set(e.id, {
            id: e.id, targetId: e.targetId, text: e.payload.text,
            at: e.at, by: e.by, issueIds: e.payload.issueIds ?? [],
          });
          break;
        case 'wo.closed':
          wos.delete(e.payload.woId);
          break;
        case 'state.changed':
          toolStates[e.targetId] = e.payload.state;
          break;
      }
    }

    for (const k of Object.keys(installed)) {
      if (installed[k] === null) delete installed[k];
    }

    return {
      installed,
      openIssues: [...issues.values()],
      openWOs: [...wos.values()],
      toolStates,
    };
  }

  // --- hierarchy and health ---------------------------------------------

  function descendantsOf(entities, entityId) {
    const out = [entityId];
    for (const e of Object.values(entities)) {
      if (e.parentId === entityId) out.push(...descendantsOf(entities, e.id));
    }
    return out;
  }

  // The deck collapses four tool states onto red. Colour alone would lose the
  // distinction, so callers render the state as text alongside the colour.
  const RED_STATES = new Set(['down', 'decommissioned', 'qual', 'pm']);

  function healthOf(entities, events, entityId, iso) {
    const st = stateAt(events, iso);
    const scope = new Set(descendantsOf(entities, entityId));
    for (const id of scope) {
      if (RED_STATES.has(st.toolStates[id])) return 'red';
    }
    const open = [...st.openIssues, ...st.openWOs];
    return open.some(o => scope.has(o.targetId)) ? 'amber' : 'green';
  }

  // --- history ------------------------------------------------------------

  // Row kinds drive the log's row tint, matching the colours in the tool-log
  // screenshot from the deck: runs plain, maintenance blue, issues purple,
  // state changes red.
  const KIND_MAP = {
    'run.recorded': 'run',
    'wo.opened': 'maint', 'wo.closed': 'maint', 'wo.commented': 'maint',
    'issue.opened': 'issue', 'issue.closed': 'issue', 'issue.commented': 'issue',
    'state.changed': 'state', 'comment.added': 'comment',
    'item.installed': 'maint', 'item.removed': 'maint',
    'item.shipped': 'maint', 'item.received': 'maint',
  };

  const DEFAULT_INFO = {
    'wo.opened': 'Maint WO', 'wo.closed': 'Maint WO', 'wo.commented': 'Maint WO',
    'issue.opened': 'Issue', 'issue.closed': 'Issue', 'issue.commented': 'Issue',
    'state.changed': 'State', 'comment.added': 'Comment',
    'item.installed': 'Installed', 'item.removed': 'Removed',
    'item.shipped': 'Shipped', 'item.received': 'Received',
  };

  function logFor(entities, events, entityId, opts = {}) {
    const scope = new Set(descendantsOf(entities, entityId));
    return events
      .filter(e => scope.has(e.targetId))
      .filter(e => (!opts.from || e.at >= opts.from) && (!opts.to || e.at <= opts.to))
      .map(e => ({
        at: e.at,
        kind: KIND_MAP[e.kind] ?? 'comment',
        info: e.payload.info ?? DEFAULT_INFO[e.kind] ?? e.kind,
        details: e.payload.text ?? e.payload.details ?? '',
        comment: e.payload.comment ?? '',
        by: e.by,
        raw: e,
      }))
      .sort((a, b) => (a.at < b.at ? 1 : a.at > b.at ? -1 : 0));
  }

  // What swapped between two dates. Drives the time-travel change markers.
  function changesBetween(entities, events, entityId, from, to) {
    const components = descendantsOf(entities, entityId)
      .filter(id => entities[id] && entities[id].kind === 'component');
    const out = [];
    for (const componentId of components) {
      const before = itemAt(events, componentId, from);
      const after = itemAt(events, componentId, to);
      if (before === after) continue;
      const swap = upto(events, to)
        .filter(e => e.targetId === componentId
                  && e.kind === 'item.installed'
                  && e.at > from)
        .pop();
      out.push({ componentId, fromItemId: before, toItemId: after, at: swap ? swap.at : to });
    }
    return out;
  }

  // --- inventory ----------------------------------------------------------

  // An item's location is derived, never stored. If it currently fills a
  // component slot it is on that slot's tool; otherwise its last shipping or
  // receiving event says where it went.
  function locationOf(entities, events, itemId, iso) {
    for (const [componentId, ent] of Object.entries(entities)) {
      if (ent.kind !== 'component') continue;
      if (itemAt(events, componentId, iso) !== itemId) continue;
      let node = entities[ent.parentId];
      while (node && node.kind !== 'tool') node = entities[node.parentId];
      return {
        locationKind: 'tool',
        locationLabel: node ? node.name : 'Unknown tool',
        componentId,
        leadTimeDays: null,
      };
    }

    // Shipping and receiving events target the item. A removal targets the
    // component and names the item in its payload — but it still says where
    // the item went, so it counts.
    let to = null, leadTimeDays = null;
    for (const e of upto(events, iso)) {
      const aboutThisItem = e.targetId === itemId
        || (e.kind === 'item.removed' && e.payload.itemId === itemId);
      if (!aboutThisItem) continue;
      if (e.kind === 'item.received' || e.kind === 'item.shipped'
          || e.kind === 'item.removed') {
        to = e.payload.to ?? to;
        leadTimeDays = e.payload.leadTimeDays ?? null;
      }
    }
    const locationKind = to === 'loc.storage' ? 'storage'
                       : to === 'loc.repair' ? 'repair'
                       : to === 'loc.onorder' ? 'onorder'
                       : to === 'loc.scrap' ? 'scrap'
                       : 'unknown';
    const locationLabel = {
      storage: 'In storage', repair: 'Out for repair', onorder: 'On order',
      scrap: 'Scrapped', unknown: 'Unknown',
    }[locationKind];
    return { locationKind, locationLabel, componentId: null, leadTimeDays };
  }

  // The deck is specific about this order: in storage first, then on another
  // tool, then on order. Serial breaks ties so the list is deterministic.
  const LOCATION_RANK = { storage: 0, tool: 1, onorder: 2, repair: 3, scrap: 4, unknown: 5 };
  const bySerial = (a, b) => (a.serial < b.serial ? -1 : a.serial > b.serial ? 1 : 0);

  function replacementCandidates(entities, events, componentId, iso) {
    const installed = itemAt(events, componentId, iso);
    const compatiblePNs = new Set(
      Object.values(entities)
        .filter(e => e.kind === 'partNumber'
                  && (e.compatibleComponentIds || []).includes(componentId))
        .map(p => p.id));

    return Object.values(entities)
      .filter(e => e.kind === 'item'
                && compatiblePNs.has(e.partNumberId)
                && e.id !== installed)
      .map(item => ({
        itemId: item.id,
        serial: item.serial,
        name: item.name,
        pn: entities[item.partNumberId] ? entities[item.partNumberId].pn : '',
        ...locationOf(entities, events, item.id, iso),
      }))
      .sort((a, b) =>
        (LOCATION_RANK[a.locationKind] - LOCATION_RANK[b.locationKind]) || bySerial(a, b));
  }

  // MFCs carry no compatibility list, so they get their own selector. Values
  // within a category are OR; categories combine with AND.
  function filterMFCs(entities, events, f = {}, iso) {
    return Object.values(entities)
      .filter(e => e.kind === 'item' && e.mfc)
      .filter(e => !(f.type && f.type.length) || f.type.includes(e.mfc.type))
      .filter(e => !(f.gas && f.gas.length) || f.gas.includes(e.mfc.gas))
      .filter(e => f.sccmMin == null || e.mfc.sccm >= f.sccmMin)
      .filter(e => f.sccmMax == null || e.mfc.sccm <= f.sccmMax)
      .map(e => ({ ...e, ...locationOf(entities, events, e.id, iso) }))
      .sort(bySerial);
  }

  // --- seed ---------------------------------------------------------------
  //
  // Plausible but invented. Vocabulary follows the decks: growth runs like
  // 23-AFRL-Ga2O3, run IDs AG####, work orders M#####, users Lori, Paul and
  // Abdel. Deterministic by construction — no Math.random, no Date.now — so
  // the page renders identically every load and screenshots stay stable.

  const SEED = (() => {
    const today = '2026-08-28T12:00:00Z';
    const origin = '2024-11-15T08:00:00Z';   // first installs predate the log
    const users = ['lori', 'paul', 'abdel'];

    const entities = {};
    const events = [];
    let seq = 0;
    const eid = () => 'sd' + String(++seq).padStart(4, '0');

    // Seeded LCG. Deterministic, and never Math.random.
    let s = 20260828;
    const rnd = () => (s = (s * 1103515245 + 12345) % 2147483648) / 2147483648;
    const pick = a => a[Math.floor(rnd() * a.length)];

    const at = (base, days, hours) =>
      new Date(Date.parse(base) + days * 86400000 + (hours || 0) * 3600000).toISOString();

    const ent = o => { entities[o.id] = o; return o; };
    const ev = (kind, targetId, payload, atIso, by) => {
      const e = { id: eid(), at: atIso, by: by || pick(users), kind, targetId, payload };
      events.push(e);
      return e;
    };

    // -- tools -------------------------------------------------------------

    const TOOLS = [
      ['t.gan09', 'GaN 09', 'HVPE', 'hvpe'],
      ['t.gan11', 'GaN 11', 'HVPE', 'hvpe'],
      ['t.gan12', 'GaN 12', 'HVPE', 'hvpe'],
      ['t.gan13', 'GaN 13', 'HVPE', 'hvpe'],
      ['t.gan16', 'GaN 16', 'HVPE', 'hvpe'],
      ['t.mocvd', 'MOCVD', 'MOCVD', 'furnace'],
      ['t.kfurnace', 'K-Furnace', 'Furnace', 'furnace'],
      ['t.pvd2', 'PVD 2', 'PVD', 'pvd'],
      ['t.pvd4', 'PVD 4', 'PVD', 'pvd'],
      ['t.pvd5', 'PVD 5', 'PVD', 'pvd'],
    ];
    TOOLS.forEach(([id, name, family, bay]) =>
      ent({ id, kind: 'tool', name, family, bay, parentId: null,
            modelled: id === 't.gan11' }));

    // -- GaN 11 subsystems, from the slide 20/21 dropdown ------------------

    const SUBS = [
      ['s.gan11.controls', 'Controls'],
      ['s.gan11.electric', 'Electric'],
      ['s.gan11.exhaust', 'Exhaust'],
      ['s.gan11.flanging', 'Flanging'],
      ['s.gan11.furnace', 'Furnace Assembly'],
      ['s.gan11.gaspanel', 'Gas Panel'],
      ['s.gan11.motion', 'Motion'],
    ];
    SUBS.forEach(([id, name]) =>
      ent({ id, kind: 'subsystem', name, parentId: 't.gan11' }));

    // -- GaN 11 components, mapped from the slide-18 button layout ---------

    const COMPONENTS = [
      ['c.gan11.topflange', 'Top Flange', 's.gan11.flanging', 'pn.flange'],
      ['c.gan11.botflange', 'Bottom Flange', 's.gan11.flanging', 'pn.flange'],
      ['c.gan11.convectron', 'Convectron', 's.gan11.exhaust', 'pn.convectron'],
      ['c.gan11.baratron', 'Baratron', 's.gan11.exhaust', 'pn.baratron'],
      ['c.gan11.trap1', 'Trap 1', 's.gan11.exhaust', 'pn.trap'],
      ['c.gan11.trap2', 'Trap 2', 's.gan11.exhaust', 'pn.trap'],
      ['c.gan11.throttle', 'Throttle Valve', 's.gan11.exhaust', 'pn.throttle'],
      ['c.gan11.drypump', 'Dry Pump', 's.gan11.exhaust', 'pn.drypump'],
      ['c.gan11.quartz', 'Quartz', 's.gan11.furnace', 'pn.quartz'],
      ['c.gan11.precursors', 'Precursors', 's.gan11.furnace', 'pn.precursor'],
      ['c.gan11.sourceboat', 'Source Boat', 's.gan11.furnace', 'pn.sourceboat'],
      ['c.gan11.rotation', 'Rotation', 's.gan11.motion', 'pn.rotation'],
      ['c.gan11.lift', 'Lift', 's.gan11.motion', 'pn.lift'],
      ['c.gan11.watermanifold', 'Water Manifold', 's.gan11.controls', 'pn.manifold'],
      ['c.gan11.tempcontroller', 'Temperature Controller', 's.gan11.controls', 'pn.tempctl'],
      ['c.gan11.heater', 'Heater Element', 's.gan11.electric', 'pn.heater'],
      ['c.gan11.feedthrough', 'Power Feedthrough', 's.gan11.electric', 'pn.feedthrough'],
    ];
    COMPONENTS.forEach(([id, name, parentId, pnId]) =>
      ent({ id, kind: 'component', name, parentId, defaultPnId: pnId }));

    // -- the gas panel, in slide-19 order ----------------------------------
    // sccm is canonical; slm lines display as sccm/1000.

    const MFC_LINES = [
      ['c.gan11.mfc.hclhigh', 'HCl High', 'Ga Run', 'HCl', 500, 'sccm'],
      ['c.gan11.mfc.hcllow', 'HCl Low', 'Ga Run', 'HCl', 50, 'sccm'],
      ['c.gan11.mfc.n2ga', 'N2 [Ga]', 'Ga Run', 'N2', 2000, 'slm'],
      ['c.gan11.mfc.h2', 'H2', 'Ga Run', 'H2', 1000, 'slm'],
      ['c.gan11.mfc.n2od', 'N2 [OD]', 'Outer Diluent', 'N2', 10000, 'slm'],
      ['c.gan11.mfc.sih4', 'SiH4', 'Inner Diluent 1', 'SiH4', 20, 'sccm'],
      ['c.gan11.mfc.n2id1', 'N2 [ID1]', 'Inner Diluent 1', 'N2', 5000, 'slm'],
      ['c.gan11.mfc.o2', 'O2', 'O2 Run', 'O2', 200, 'sccm'],
      ['c.gan11.mfc.n2o2', 'N2 [O2]', 'O2 Run', 'N2', 1000, 'slm'],
      ['c.gan11.mfc.hclid', 'HCl ID', 'Inner Diluent 2', 'HCl', 100, 'sccm'],
      ['c.gan11.mfc.n2id2', 'N2 [ID2]', 'Inner Diluent 2', 'N2', 5000, 'slm'],
      ['c.gan11.mfc.n2dump', 'N2 [Dump]', 'Dump Tube', 'N2', 10000, 'slm'],
    ];
    MFC_LINES.forEach(([id, name, channel, gas, sccm, unit], i) =>
      ent({ id, kind: 'component', name, parentId: 's.gan11.gaspanel',
            isMFC: true, channel, gas, unit, order: i }));

    // The panel has spare capacity. The deck asks for empty slots to be shown
    // greyed rather than hidden.
    ['spare1', 'spare2'].forEach((k, i) =>
      ent({ id: 'c.gan11.mfc.' + k, kind: 'component', name: 'Empty slot',
            parentId: 's.gan11.gaspanel', isMFC: true, empty: true,
            channel: 'Dump Tube', order: MFC_LINES.length + i }));

    // -- exhaust on the other HVPE tools -----------------------------------
    // Enough to make cross-tool history real and to give replacement
    // candidates somewhere to live other than storage.

    const HVPE_OTHERS = ['t.gan09', 't.gan12', 't.gan13', 't.gan16'];
    const SHARED_EXHAUST = [
      ['throttle', 'Throttle Valve', 'pn.throttle'],
      ['baratron', 'Baratron', 'pn.baratron'],
      ['convectron', 'Convectron', 'pn.convectron'],
      ['drypump', 'Dry Pump', 'pn.drypump'],
    ];
    HVPE_OTHERS.forEach(toolId => {
      const short = toolId.slice(2);
      const subId = 's.' + short + '.exhaust';
      ent({ id: subId, kind: 'subsystem', name: 'Exhaust', parentId: toolId });
      SHARED_EXHAUST.forEach(([key, name, pnId]) =>
        ent({ id: 'c.' + short + '.' + key, kind: 'component', name,
              parentId: subId, defaultPnId: pnId }));
    });

    // -- part numbers ------------------------------------------------------

    const compatible = key =>
      Object.values(entities)
        .filter(e => e.kind === 'component' && e.defaultPnId === key)
        .map(e => e.id);

    const PNS = [
      ['pn.throttle', 'KY-TV-1050', 'Throttle Valve, 100mm ISO'],
      ['pn.baratron', 'KY-BAR-627', 'Baratron capacitance manometer, 10 Torr'],
      ['pn.convectron', 'KY-CVG-275', 'Convectron gauge tube'],
      ['pn.drypump', 'KY-DP-2400', 'Dry pump, 2400 L/min'],
      ['pn.trap', 'KY-TRP-400', 'Particle trap assembly'],
      ['pn.flange', 'KY-FLG-200', 'Reactor flange, 200mm'],
      ['pn.quartz', 'KY-QTZ-4IN', 'Quartz liner, 4 in build'],
      ['pn.precursor', 'KY-PRC-GA', 'Ga source charge assembly'],
      ['pn.sourceboat', 'KY-BOAT-88', 'Source boat, quartz'],
      ['pn.rotation', 'KY-ROT-12', 'Rotation drive'],
      ['pn.lift', 'KY-LFT-08', 'Lift actuator'],
      ['pn.manifold', 'KY-WM-16', 'Water manifold, 16 circuit'],
      ['pn.tempctl', 'KY-TC-3508', 'Temperature controller'],
      ['pn.heater', 'KY-HTR-KAN', 'Kanthal heater element'],
      ['pn.feedthrough', 'KY-PFT-4K', 'Power feedthrough, 4 kA'],
    ];
    PNS.forEach(([id, pn, desc]) =>
      ent({ id, kind: 'partNumber', pn, description: desc,
            compatibleComponentIds: compatible(id), lowStockAt: 1 }));

    // MFCs deliberately carry no compatibility list — the deck says to use the
    // MFC Selector instead of a per-component dropdown.
    ent({ id: 'pn.mfc', kind: 'partNumber', pn: 'KY-MFC-GEN',
          description: 'Mass flow controller (see MFC Selector)',
          compatibleComponentIds: [], lowStockAt: 2 });
    ent({ id: 'pn.gabottle', kind: 'partNumber', pn: 'KY-GA-7N',
          description: 'Gallium, 7N, 1 kg bottle',
          compatibleComponentIds: [], lowStockAt: 3 });

    // -- items -------------------------------------------------------------

    let serialSeq = 1000;
    const mkItem = (pnId, name, extra) => {
      serialSeq += 7;
      const id = 'i.' + pnId.slice(3) + '.' + serialSeq;
      return ent({ id, kind: 'item', name, partNumberId: pnId,
                   serial: 'S-' + serialSeq, ...(extra || {}) });
    };

    // One installed item per non-MFC component, installed before the log opens.
    const nonMFC = Object.values(entities)
      .filter(e => e.kind === 'component' && !e.isMFC);
    nonMFC.forEach((c, i) => {
      const pn = entities[c.defaultPnId];
      const item = mkItem(c.defaultPnId, pn.description);
      ev('item.received', item.id, { to: 'loc.storage' }, at(origin, -30 - i, 0), 'lori');
      ev('item.installed', c.id, { itemId: item.id }, at(origin, -i, 0), 'paul');
    });

    // MFC items: one per populated line, plus spares in storage, on order and
    // out for repair so the selector and the spares view have range.
    const MFC_TYPES = ['1100', '1400', 'G-series', 'black', 'green'];
    const mkMFC = (gas, sccm, unit, typeIdx) => {
      const label = unit === 'slm' ? (sccm / 1000) + ' slm' : sccm + ' sccm';
      return mkItem('pn.mfc', label + ' ' + gas + ' MFC',
        { mfc: { type: MFC_TYPES[typeIdx % MFC_TYPES.length], gas, sccm, unit } });
    };

    MFC_LINES.forEach(([id, , , gas, sccm, unit], i) => {
      const item = mkMFC(gas, sccm, unit, i);
      ev('item.received', item.id, { to: 'loc.storage' }, at(origin, -40 - i, 0), 'lori');
      ev('item.installed', id, { itemId: item.id }, at(origin, -i, 1), 'paul');
    });

    // Spare MFCs in storage.
    [['O2', 200, 'sccm'], ['O2', 500, 'sccm'], ['N2', 2000, 'slm'],
     ['N2', 5000, 'slm'], ['HCl', 100, 'sccm'], ['H2', 1000, 'slm'],
     ['NH3', 500, 'sccm'], ['Ar', 100, 'sccm'], ['CH4', 20, 'sccm'],
    ].forEach(([gas, sccm, unit], i) => {
      const item = mkMFC(gas, sccm, unit, i + 2);
      ev('item.received', item.id, { to: 'loc.storage' }, at(origin, -20 - i, 0), 'lori');
    });

    // A spare on order, and one out for repair.
    const onOrder = mkMFC('O2', 200, 'sccm', 3);
    ev('item.shipped', onOrder.id, { to: 'loc.onorder', leadTimeDays: 42 },
       at(today, -18, 0), 'abdel');
    const inRepair = mkMFC('N2', 10000, 'slm', 1);
    ev('item.shipped', inRepair.id, { to: 'loc.repair' }, at(today, -55, 0), 'abdel');

    // Spare throttle valves and baratrons, so replacement has real choices.
    const spareThrottle = mkItem('pn.throttle', 'Throttle Valve, 100mm ISO');
    ev('item.received', spareThrottle.id, { to: 'loc.storage' }, at(origin, -12, 0), 'lori');
    const spareBaratron = mkItem('pn.baratron', 'Baratron capacitance manometer, 10 Torr');
    ev('item.received', spareBaratron.id, { to: 'loc.storage' }, at(origin, -11, 0), 'lori');

    // Gallium bottles, for the Refill flow.
    [0, 1, 2].forEach(i => {
      const bottle = mkItem('pn.gabottle', 'Gallium 7N, 1 kg',
        { lot: 'GA-25-' + (410 + i) });
      ev('item.received', bottle.id, { to: 'loc.storage' }, at(origin, 100 + i * 60, 0), 'lori');
    });

    // -- growth runs -------------------------------------------------------

    const RECIPES = ['23-AFRL-Ga2O3', '24-ONR-GaN', '25-NASA-AlN', '20256053'];
    const RUN_NOTES = [
      '', '', '', '', 'solvent clean, DI rinse, and N2 dry prior to load',
      '', '', 'slid to edge of backer before growth', '', '',
    ];
    const logStart = '2025-02-01T08:00:00Z';
    const spanDays = Math.round((Date.parse(today) - Date.parse(logStart)) / 86400000);
    let runNo = 5820;
    for (let d = 0; d < spanDays; d += 4) {
      runNo += 1;
      ev('run.recorded', 't.gan11', {
        info: 'Ran: ' + RECIPES[runNo % RECIPES.length],
        details: 'AG' + runNo,
        comment: RUN_NOTES[runNo % RUN_NOTES.length],
      }, at(logStart, d, 9 + (runNo % 8)));
    }

    // -- maintenance work orders -------------------------------------------

    const WO_TITLES = [
      ['Chlorine Bottle Change', 's.gan11.gaspanel'],
      ['Clogged proteus inlet — water issue', 's.gan11.controls'],
      ['Installed new argon dewar', 's.gan11.gaspanel'],
      ['Chlorine purifier replacement', 's.gan11.gaspanel'],
      ['Hot swapped filters out for a clean set', 's.gan11.exhaust'],
      ['Ramp down to alpha phase temps', 't.gan11'],
      ['Trap 1 clean and reseal', 'c.gan11.trap1'],
      ['Dry pump oil change', 'c.gan11.drypump'],
      ['Rotation drive belt replacement', 'c.gan11.rotation'],
      ['Quartz liner swap for 4 in build', 'c.gan11.quartz'],
      ['Baratron recalibration', 'c.gan11.baratron'],
      ['Heater element resistance check', 'c.gan11.heater'],
    ];
    let woNo = 150;
    WO_TITLES.forEach(([title, target], i) => {
      woNo += 3;
      const opened = at(logStart, 20 + i * 45, 10);
      const closed = at(logStart, 20 + i * 45 + 2, 15);
      const wo = ev('wo.opened', target,
        { text: title, info: 'Maint WO: M' + String(woNo).padStart(5, '0') }, opened);
      ev('wo.closed', target, {
        woId: wo.id,
        info: 'Maint WO: M' + String(woNo).padStart(5, '0'),
        text: title,
        comment: 'Finished: ' + closed.slice(0, 10),
      }, closed);
    });

    // -- issues ------------------------------------------------------------

    const ISSUES = [
      ['c.gan11.baratron', 'Pressure is unstable and the first reading drifts high', 60, 74],
      ['c.gan11.throttle', 'Throttle valve hunting around setpoint', 150, 165],
      ['s.gan11.gaspanel', 'NH3 leg connection weeping at the fitting', 240, 262],
      ['c.gan11.drypump', 'Dry pump running warm, exhaust smells hot', 330, 341],
      ['c.gan11.mfc.sih4', 'SiH4 MFC will not zero after purge', 400, 412],
      ['c.gan11.watermanifold', 'Water flow alarm on circuit 6', 470, 478],
      ['c.gan11.convectron', 'Convectron reading 2 decades low against the baratron', 520, 533],
    ];
    ISSUES.forEach(([target, text, openDay, closeDay]) => {
      const opened = ev('issue.opened', target, { text }, at(logStart, openDay, 11));
      ev('issue.closed', target, {
        issueId: opened.id, text,
        comment: 'Closed against maintenance work order.',
      }, at(logStart, closeDay, 16));
    });

    // Left open on purpose: GaN 11 must read amber today so the demo opens on
    // something worth clicking.
    ev('issue.opened', 'c.gan11.mfc.hcllow',
       { text: 'HCl Low MFC is acting funny and will not hold setpoint below 10 sccm' },
       at(today, -9, 10), 'lori');
    ev('wo.opened', 'c.gan11.trap2',
       { text: 'Trap 2 differential pressure climbing — schedule clean',
         info: 'Maint WO: M00201' },
       at(today, -4, 13), 'abdel');

    // -- tool state --------------------------------------------------------

    ev('state.changed', 't.gan11', { state: 'down',
      text: 'Tool ramped down over the weekend from a water issue' },
      at(logStart, 300, 16));
    ev('state.changed', 't.gan11', { state: 'up',
      text: 'Water flow issue resolved, one leak located and sealed' },
      at(logStart, 312, 9));

    // GaN 12 is mid-rebuild. The System Notes timeline mentions exactly this.
    ev('state.changed', 't.gan12', { state: 'down',
      text: 'Rebuild for Gallium Nitride — boule build follows' },
      at(today, -70, 8));
    ev('state.changed', 't.gan13', { state: 'qual',
      text: 'Qualification runs for 150mm templates' },
      at(today, -25, 8));

    // -- component swaps ---------------------------------------------------
    // Four on GaN 11, one of them the O2 MFC so the date scrubber has
    // something visible to show.

    const swap = (componentId, dayFromToday, to, newItem) => {
      const when = at(today, dayFromToday, 11);
      const old = itemAt(events, componentId, when);
      if (old) ev('item.removed', componentId, { itemId: old, to }, when, 'paul');
      ev('item.installed', componentId, { itemId: newItem.id },
         at(today, dayFromToday, 12), 'paul');
    };

    const newO2 = mkMFC('O2', 200, 'sccm', 4);
    ev('item.received', newO2.id, { to: 'loc.storage' }, at(today, -200, 0), 'lori');
    swap('c.gan11.mfc.o2', -180, 'loc.repair', newO2);

    const newThrottle = mkItem('pn.throttle', 'Throttle Valve, 100mm ISO');
    ev('item.received', newThrottle.id, { to: 'loc.storage' }, at(today, -150, 0), 'lori');
    swap('c.gan11.throttle', -140, 'loc.repair', newThrottle);

    const newBaratron = mkItem('pn.baratron', 'Baratron capacitance manometer, 10 Torr');
    ev('item.received', newBaratron.id, { to: 'loc.storage' }, at(today, -95, 0), 'lori');
    swap('c.gan11.baratron', -88, 'loc.storage', newBaratron);

    const newSiH4 = mkMFC('SiH4', 20, 'sccm', 0);
    ev('item.received', newSiH4.id, { to: 'loc.storage' }, at(today, -60, 0), 'lori');
    swap('c.gan11.mfc.sih4', -52, 'loc.repair', newSiH4);

    events.sort((a, b) => (a.at < b.at ? -1 : a.at > b.at ? 1 : 0));

    return Object.freeze({ entities, events, today, users });
  })();

  // --- persistence --------------------------------------------------------
  //
  // The seed is frozen and never written to. Anything done in the browser is
  // appended to an overlay in localStorage and layered on at read time, so
  // Reset always returns the demo to a known state.

  const STORE_KEY = 'epitrax-poc-v1';

  function createStore(storage) {
    const read = () => {
      try {
        const raw = storage.getItem(STORE_KEY);
        const parsed = raw ? JSON.parse(raw) : [];
        return Array.isArray(parsed) ? parsed : [];
      } catch (err) {
        return [];
      }
    };
    return {
      events() {
        return [...SEED.events, ...read()]
          .sort((a, b) => (a.at < b.at ? -1 : a.at > b.at ? 1 : 0));
      },
      userEvents: read,
      append(event) {
        try {
          storage.setItem(STORE_KEY, JSON.stringify([...read(), event]));
        } catch (err) {
          // A full or unavailable store should not break the demo.
        }
        return event;
      },
      reset() {
        try { storage.removeItem(STORE_KEY); } catch (err) { /* ignore */ }
      },
    };
  }

  return {
    SEED, createStore,
    itemAt, stateAt, descendantsOf, healthOf, logFor, changesBetween,
    locationOf, replacementCandidates, filterMFCs, RED_STATES,
  };
})();
</script>

<body>
<header class="rail">
  <div class="brand">
    <div class="wordmark">EPITRAX</div>
    <div class="eyebrow">Maintenance Console · Prototype</div>
  </div>
  <nav class="crumbs" id="crumbs"></nav>
  <div class="railright">
    <label class="datewrap" title="View the floor as it was on this date">
      <span class="eyebrow">Viewing</span>
      <input type="date" id="asof">
    </label>
    <button class="btn" id="todayBtn">Today</button>
    <button class="btn warn" id="resetBtn" title="Discard changes made in this browser">Reset</button>
  </div>
</header>

<main id="main"></main>
<div id="modalRoot"></div>

<script id="ui">
(() => {
  'use strict';
  const E = globalThis.EpiTrax;
  const S = E.SEED;

  // --- tiny DOM helper ---------------------------------------------------
  function el(tag, attrs, ...kids) {
    const node = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v == null || v === false) continue;
      if (k === 'class') node.className = v;
      else if (k === 'html') node.innerHTML = v;
      else if (k.startsWith('on')) node.addEventListener(k.slice(2), v);
      else if (k === 'style') node.setAttribute('style', v);
      else node.setAttribute(k, v === true ? '' : v);
    }
    for (const kid of kids.flat(4)) {
      if (kid == null || kid === false) continue;
      node.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
    }
    return node;
  }
  const svg = (tag, attrs, ...kids) => {
    const node = document.createElementNS('http://www.w3.org/2000/svg', tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v == null || v === false) continue;
      if (k.startsWith('on')) node.addEventListener(k.slice(2), v);
      else node.setAttribute(k, v);
    }
    for (const kid of kids.flat(4)) if (kid != null && kid !== false) node.append(kid);
    return node;
  };

  // --- formatting --------------------------------------------------------
  const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const fmtDay = iso => {
    const d = new Date(iso);
    return d.getUTCDate() + ' ' + MONTHS[d.getUTCMonth()] + ' ' + d.getUTCFullYear();
  };
  const fmtStamp = iso => {
    const d = new Date(iso);
    let h = d.getUTCHours(); const ap = h >= 12 ? 'PM' : 'AM';
    h = h % 12 || 12;
    return (d.getUTCMonth() + 1) + '/' + d.getUTCDate() + '/' + d.getUTCFullYear()
      + ' ' + h + ':' + String(d.getUTCMinutes()).padStart(2, '0') + ' ' + ap;
  };
  const dayOf = iso => iso.slice(0, 10);
  const endOfDay = day => day + 'T23:59:59Z';
  const flow = m => (m.unit === 'slm' ? (m.sccm / 1000) + ' slm' : m.sccm + ' sccm');

  // --- app state ---------------------------------------------------------
  const store = E.createStore(safeLocalStorage());
  function safeLocalStorage() {
    try {
      const probe = '__epitrax__';
      window.localStorage.setItem(probe, '1');
      window.localStorage.removeItem(probe);
      return window.localStorage;
    } catch (err) {
      // Private mode or blocked site data. The demo still works, it just
      // forgets between reloads.
      const m = new Map();
      return { getItem: k => (m.has(k) ? m.get(k) : null),
               setItem: (k, v) => m.set(k, v), removeItem: k => m.delete(k) };
    }
  }

  let asOf = S.today;

  function ctx() {
    return { entities: S.entities, events: store.events(), at: asOf, store };
  }
  const isToday = () => dayOf(asOf) === dayOf(S.today);

  // --- routing -----------------------------------------------------------
  function parseHash() {
    const parts = (location.hash || '#/').replace(/^#\/?/, '').split('/');
    return { view: parts[0] || 'home', id: decodeURIComponent(parts[1] || '') };
  }
  const go = (view, id) =>
    { location.hash = '#/' + view + (id ? '/' + encodeURIComponent(id) : ''); };
  const link = (view, id) => ({ href: '#/' + view + (id ? '/' + encodeURIComponent(id) : '') });

  // Each view is `(root, ctx, id) => void`. Every one of them derives from
  // ctx.at, which is what makes the date scrubber work without per-view code.
  const VIEWS = {};

  const stub = name => (root) => root.append(
    el('div', { class: 'panel' }, el('h3', {}, name), el('p', { class: 'note' }, 'Not built yet.')));
  for (const v of ['home', 'facility', 'tool', 'subsystem', 'component', 'item', 'spares', 'across']) {
    VIEWS[v] = stub(v);
  }

  // --- facility ----------------------------------------------------------
  //
  // Drawn as bays rather than the source deck's building floorplan. The POC
  // needs tool positions, not their architecture.

  const BAYS = [
    ['hvpe', 'HVPE Bay'],
    ['pvd', 'PVD Bay'],
    ['furnace', 'Furnace / MOCVD'],
  ];

  // The deck maps four states onto red. Colour alone would lose that, so
  // every tile also carries its state as text.
  const STATE_LABEL = {
    up: 'Up', down: 'Down', decommissioned: 'Decomm', qual: 'Qual', pm: 'PM',
  };

  function toolStatus(c, toolId) {
    const health = E.healthOf(c.entities, c.events, toolId, c.at);
    const state = E.stateAt(c.events, c.at).toolStates[toolId] || 'up';
    const openCount = E.stateAt(c.events, c.at).openIssues
      .concat(E.stateAt(c.events, c.at).openWOs)
      .filter(o => new Set(E.descendantsOf(c.entities, toolId)).has(o.targetId)).length;
    return { health, state, openCount };
  }

  function toolTile(c, tool) {
    const { health, state, openCount } = toolStatus(c, tool.id);
    const label = health === 'red'
      ? (STATE_LABEL[state] || state).toUpperCase()
      : (openCount ? 'Up · attention' : 'Up');
    return el('a', { class: 'tile t-' + health, ...link('tool', tool.id) },
      el('span', { class: 'tile-accent' }),
      openCount ? el('span', { class: 'tile-badge' }, openCount) : null,
      el('div', { class: 'tile-name' }, tool.name),
      el('div', { class: 'tile-state' }, label),
      el('div', { class: 'tile-sub' }, tool.family + (tool.modelled ? ' · modelled' : '')));
  }

  VIEWS.facility = (root, c) => {
    const tools = Object.values(c.entities).filter(e => e.kind === 'tool');
    const counts = { green: 0, amber: 0, red: 0 };
    tools.forEach(t => { counts[E.healthOf(c.entities, c.events, t.id, c.at)] += 1; });

    root.append(el('div', { class: 'viewhead' },
      el('div', { class: 'viewtitle' }, 'Facility'),
      el('div', { class: 'eyebrow' },
        counts.green + ' up · ' + counts.amber + ' with open work · ' + counts.red + ' not running')));

    root.append(el('div', { class: 'bays' },
      BAYS.map(([bay, name]) => el('section', { class: 'bay' },
        el('div', { class: 'bay-name' }, name),
        el('div', { class: 'tiles' },
          tools.filter(t => t.bay === bay).map(t => toolTile(c, t)))))));

    root.append(el('div', { class: 'legend' },
      el('span', {}, el('i', { class: 'dot s-green' }), 'Up, no open issues'),
      el('span', {}, el('i', { class: 'dot s-amber' }), 'Up, open issue or work order'),
      el('span', {}, el('i', { class: 'dot s-red' }), 'Down, decommissioned, qual or PM'),
      el('span', { class: 'note' },
        'Bay layout is illustrative. Only GaN 11 is modelled to component level.')));
  };

  function render() {
    const { view, id } = parseHash();
    const c = ctx();
    const main = document.getElementById('main');
    main.replaceChildren();
    const fn = VIEWS[view] || VIEWS.home;
    try {
      fn(main, c, id);
    } catch (err) {
      main.append(el('div', { class: 'panel' },
        el('h3', {}, 'This view failed to render'),
        el('pre', { class: 'mono' }, String(err && err.stack || err))));
      throw err;
    }
    renderCrumbs(c, view, id);
    document.getElementById('asof').value = dayOf(asOf);
    document.body.classList.toggle('past', !isToday());
  }

  // --- breadcrumb --------------------------------------------------------
  const VIEW_FOR_KIND = { tool: 'tool', subsystem: 'subsystem', component: 'component', item: 'item' };

  function ancestry(entities, id) {
    const chain = [];
    let node = entities[id];
    while (node) { chain.unshift(node); node = node.parentId ? entities[node.parentId] : null; }
    return chain;
  }

  function renderCrumbs(c, view, id) {
    const nav = document.getElementById('crumbs');
    nav.replaceChildren();
    const crumbs = [['Home', 'home', '']];
    if (view !== 'home') crumbs.push(['Facility', 'facility', '']);

    if (view === 'item') {
      const item = c.entities[id];
      crumbs.push(['Spares', 'spares', '']);
      if (item) crumbs.push([item.serial, 'item', id]);
    } else if (c.entities[id]) {
      for (const node of ancestry(c.entities, id)) {
        crumbs.push([node.name, VIEW_FOR_KIND[node.kind] || 'facility', node.id]);
      }
    } else if (view === 'spares') {
      crumbs.push(['Spares', 'spares', '']);
    } else if (view === 'across') {
      crumbs.push(['Cross-tool history', 'across', '']);
    }

    crumbs.forEach(([label, v, cid], i) => {
      if (i) nav.append(el('span', { class: 'crumb-sep' }, '/'));
      const here = i === crumbs.length - 1;
      nav.append(el('a', { class: 'crumb' + (here ? ' here' : ''), ...link(v, cid) }, label));
    });
  }

  // --- shell wiring ------------------------------------------------------
  document.getElementById('asof').addEventListener('change', e => {
    const day = e.target.value;
    if (!day) return;
    asOf = dayOf(S.today) === day ? S.today : endOfDay(day);
    render();
  });
  document.getElementById('todayBtn').addEventListener('click', () => {
    asOf = S.today; render();
  });
  document.getElementById('resetBtn').addEventListener('click', () => {
    store.reset(); asOf = S.today; render();
  });
  window.addEventListener('hashchange', render);

  // Exposed so the view sections below can register themselves.
  globalThis.EpiTraxUI = {
    el, svg, VIEWS, render, go, link, ctx, store,
