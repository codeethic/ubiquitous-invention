# --- Site ---
title: ubiquitous-invention
description: one tired engineer making sense of code, hockey, bourbon & grief

# --- Theme (GitHub Pages supported) ---
theme: jekyll-theme-hacker

# --- Header buttons ---
show_downloads: false

# --- Permalinks ---
# Date-free URLs (e.g. /jacob/) so re-dating posts never changes their links.
permalink: /:title/

# --- Build ---
plugins:
  - jekyll-feed
  - jekyll-seo-tag

# Exclude project source from the built site
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  # Design specs live in the repo, not on the site.
  - superpowers
  # Flat Earth Lab test scaffolding; the app itself publishes normally.
  # Note: its vendored Three.js lives in flat-earth/third-party/, deliberately
  # not named "vendor", so the bare `vendor` entry above cannot swallow it.
  - flat-earth/test
  - flat-earth/package.json
  - flat-earth/README.md
  # Local dev server; the published site is served by GitHub Pages.
  - flat-earth/serve.py
  # Coastline build tool; its output (data/coastlines.json) does publish.
  - flat-earth/tools
